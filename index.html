<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imzipdoc サンプル</title>
  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">imzipdoc</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">ホーム</a></li>
          <li class="nav-item"><a class="nav-link" href="#features">特徴</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">お問い合わせ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ヒーローセクション -->
  <div class="bg-primary text-white text-center py-5">
    <div class="container">
      <h1 class="display-4">Bootstrap 5 サンプルページ</h1>
      <p class="lead">CDN経由でBootstrap 5を読み込んだシンプルなサンプルです。</p>
      <a href="#features" class="btn btn-light btn-lg mt-3">詳しく見る</a>
    </div>
  </div>

  <!-- 特徴セクション -->
  <div class="container my-5" id="features">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">レスポンシブ</h5>
            <p class="card-text">Bootstrap 5のグリッドシステムにより、様々な画面サイズに対応します。</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">コンポーネント</h5>
            <p class="card-text">ナビバーやカード、ボタンなど豊富なUIコンポーネントを利用できます。</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">CDN対応</h5>
            <p class="card-text">ビルド不要でCDNから直接読み込むだけで利用開始できます。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- お問い合わせセクション -->
  <div class="container my-5" id="contact">
    <h2 class="mb-4">お問い合わせ</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">お名前</label>
        <input type="text" class="form-control" id="name" placeholder="山田 太郎">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">メールアドレス</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">メッセージ</label>
        <textarea class="form-control" id="message" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">送信</button>
    </form>
  </div>

  <!-- フッター -->
  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <p class="mb-0">&copy; 2026 imzipdoc</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
